[project]
name = "ha-climate-director"
version = "7.6.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/climate_director"]
branch = true

[tool.coverage.report]
show_missing = true

# `precision` is geen luxe: zonder deze regel vergelijkt coverage het percentage
# afgerond op nul decimalen met `fail_under`, en dan is 99,69 gelijk aan 100 en
# vuurt de drempel nooit. Ronde 31 heeft dat gemeten: met `fail_under = 99.70`
# en de standaardprecisie kwam een dode tak gewoon door (exit 0), met
# `precision = 2` viel hij om. / `precision` is not a luxury: without this line
# coverage compares the percentage rounded to zero decimals with `fail_under`,
# and then 99.69 equals 100 and the threshold never fires. Round 31 measured
# that: with `fail_under = 99.70` and the default precision a dead branch simply
# passed (exit 0), while with `precision = 2` it dropped.
precision = 2

# Twee bewakingen op dezelfde meting, met een verschillende taak.
#
# 1. `script/coverage_gate.py` (CI-stap "Coverage gate") eist dat geen enkele
#    regel gemist is. Dat is de scherpe, deterministische eis: of een regel is
#    uitgevoerd hangt niet van de run af. De meting van ronde 31: 5007 van 5007
#    regels geraakt, 0 gemist.
# 2. `fail_under` hieronder is de ratel op het totaal. Die moet de wiebel in de
#    partiële takken verdragen: ronde 31 mat op identieke code 20 én 21 partiële
#    takken (dezelfde suite, twee runs). Eén gemiste regel geeft 99,69 of 99,67
#    procent, dus een drempel die één gemiste regel betrapt zou de ene run goed-
#    en de andere afkeuren. Daarom staat hij op 99.68: hij valt bij twee gemiste
#    regels, en de poort hierboven vangt de enkele.
#
# De open takken zelf zijn één kant van een lus of een kortsluiting (`a or b`)
# die nooit langskomt; die zijn met een test noch een pragma gedicht en staan als
# idee in ROADMAP.md. Zakt de dekking, dan hoort de vraag "welke test is hier
# vergeten" gesteld te worden, niet de drempel verlaagd; een regel die er echt
# niet komt, krijgt een pragma met de reden erachter.
#
# Two guards on the same measurement, with a different task.
#
# 1. `script/coverage_gate.py` (CI step "Coverage gate") demands that not a
#    single line is missed. That is the sharp, deterministic demand: whether a
#    line ran does not depend on the run. Round 31's measurement: 5007 of 5007
#    lines touched, 0 missed.
# 2. `fail_under` below is the ratchet on the total. It has to absorb the wobble
#    in the partial branches: round 31 measured 20 and 21 partial branches on
#    identical code (same suite, two runs). One missed line yields 99.69 or
#    99.67 percent, so a threshold that catches one missed line would pass the
#    one run and fail the other. Hence it sits at 99.68: it drops at two missed
#    lines, and the gate above catches the single one.
#
# The open branches themselves are one side of a loop or a short-circuit
# (`a or b`) that never comes past; neither a test nor a pragma closes them, and
# they stand as an idea in ROADMAP.md. If coverage drops, the question to ask is
# "which test was forgotten here", not to lower the threshold; a line that truly
# cannot be reached gets a pragma with the reason behind it.
fail_under = 99.68

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
strict = true
# Iedere onderdrukking noemt haar foutcode. `PROBE: int = "tapijt"  # type: ignore`
# is met `strict` alleen stil groen (de ignore slikt de echte fout in); deze code
# laat hem vallen. De enige `# type: ignore` in het pakket draagt al `[arg-type]`.
#
# Every suppression names its error code. `PROBE: int = "tapijt"  # type: ignore`
# is silently green under `strict` alone (the ignore swallows the real error);
# this code turns it red. The package's only `# type: ignore` already carries
# `[arg-type]`.
enable_error_code = ["ignore-without-code"]

