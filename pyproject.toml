[project]
name = "ha-climate-director"
version = "7.7.7"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/climate_director"]
branch = true

[tool.coverage.report]
show_missing = true

# De drie patronen waarmee coverage regels buiten de meting houdt, uitgeschreven
# in plaats van als verborgen standaard. Ze staan hier zodat de configuratie zelf
# laat zien wat er buiten blijft, en niet een versie van coverage die ze stil
# meebrengt; de patronen zijn die van coverage 7.16, één op één overgenomen, dus
# de meting verandert er niet van. Wat het patroon raakt wordt sinds ronde 34
# (R34-2) met naam en toenaam gemeld door `script/coverage_gate.py`
# (`NAMED_EXCLUSIONS`): een regel zonder naam laat de poort vallen, en een naam
# zonder regel ook.
#
# The three patterns with which coverage keeps lines out of the measurement,
# written out instead of as a hidden default. They stand here so that the
# configuration itself shows what stays outside, rather than a version of
# coverage quietly bringing them along; the patterns are coverage 7.16's, copied
# one to one, so the measurement does not change. What the pattern hits is
# reported by name since round 34 (R34-2) by `script/coverage_gate.py`
# (`NAMED_EXCLUSIONS`): a line without a name drops the gate, and so does a name
# without a line.
exclude_lines = [
    '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER)',
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
    'if (typing\.)?TYPE_CHECKING:',
]

# `precision` is geen luxe: zonder deze regel vergelijkt coverage het percentage
# afgerond op nul decimalen met `fail_under`, en dan is 99,69 gelijk aan 100 en
# vuurt de drempel nooit. Ronde 31 heeft dat gemeten: met `fail_under = 99.70`
# en de standaardprecisie kwam een dode tak gewoon door (exit 0), met
# `precision = 2` viel hij om. / `precision` is not a luxury: without this line
# coverage compares the percentage rounded to zero decimals with `fail_under`,
# and then 99.69 equals 100 and the threshold never fires. Round 31 measured
# that: with `fail_under = 99.70` and the default precision a dead branch simply
# passed (exit 0), while with `precision = 2` it dropped.
precision = 2

# Twee bewakingen op dezelfde meting, met een verschillende taak.
#
# 1. `script/coverage_gate.py` houdt de regels die coverage buiten de meting
#    laat bij naam (`NAMED_EXCLUSIONS`) en eist dat geen enkele regel gemist is.
# 2. `fail_under` hieronder staat op 100: geen gemiste regel en geen halve tak.
#    Van elke `if`, elke lus en elke kortsluiting (`a or b`) is ook de andere
#    kant gemeten. Een toets voor zo'n kant staat in het toetsbestand van zijn
#    onderwerp, zo nodig met verzonnen invoer. Een tak die tussen twee runs
#    wisselt, is een toets die niet vastligt: maak die toets vast in plaats van
#    de drempel te verlagen.
#
# `script/run_tests.py` leest deze drempel bij een volledige run; bij een
# selectie meet hij alleen de gewijzigde pakketbestanden, ook op 100. Een regel
# die er echt niet komt krijgt een toets met verzonnen invoer: het pakket draagt
# **geen enkele** `pragma: no cover`. Zo'n pragma haalt een regel uit deze
# meting, en dan zegt "nul gemist" niets meer over die regel;
# `tests/test_reachable_branches_deep.py::test_nothing_is_hidden_from_the_measurement`
# houdt dat vast.
#
# Two guards on the same measurement, with a different task.
#
# 1. `script/coverage_gate.py` keeps the lines coverage leaves outside the
#    measurement by name (`NAMED_EXCLUSIONS`) and demands that not a single line
#    is missed.
# 2. `fail_under` below stands at 100: no missed line and no half branch. Of
#    every `if`, every loop and every short circuit (`a or b`) the other side is
#    measured too. A test for such a side stands in the test file of its
#    subject, with invented input where needed. A branch that changes
#    between two runs is a test that is not pinned down: pin that test down
#    instead of lowering the threshold.
#
# `script/run_tests.py` reads this threshold on a full run; on a selection it
# measures only the changed package files, at 100 as well. A line that truly
# cannot be reached gets a test with invented input: the package carries **no**
# `pragma: no cover`. Such a pragma takes a line out of this measurement, and
# then "zero missed" says nothing about that line;
# `tests/test_reachable_branches_deep.py::test_nothing_is_hidden_from_the_measurement`
# holds that down.
fail_under = 100

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
strict = true
# Iedere onderdrukking noemt haar foutcode. `PROBE: int = "tapijt"  # type: ignore`
# is met `strict` alleen stil groen (de ignore slikt de echte fout in); deze code
# laat hem vallen. De enige `# type: ignore` in het pakket draagt al `[arg-type]`.
#
# Every suppression names its error code. `PROBE: int = "tapijt"  # type: ignore`
# is silently green under `strict` alone (the ignore swallows the real error);
# this code turns it red. The package's only `# type: ignore` already carries
# `[arg-type]`.
enable_error_code = ["ignore-without-code"]

