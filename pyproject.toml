[project]
name = "ha-climate-director"
version = "7.6.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/climate_director"]
branch = true

[tool.coverage.report]
show_missing = true

# Elk statement in de integratie wordt door de suite geraakt: de meting van
# ronde 31 laat 0 gemiste regels zien (4995 van 4995). De 21 open takken die
# `branch = true` daarnaast meet, zijn één kant van een lus of een kortsluiting
# (`a or b`) die nooit langskomt; die zijn met een test noch een pragma gedicht
# en staan als idee in ROADMAP.md. De drempel staat op het gemeten totaal met
# twee decimalen: 99,687 % -> 99.68. Dat is een ratel: één nieuwe ongedekte regel
# laat `coverage report` meteen omvallen (een extra gemiste regel zakt naar
# 99,672 %), terwijl een gedekte regel de drempel juist ruimte geeft. Zakt de
# dekking, dan hoort de vraag "welke test is hier vergeten" gesteld te worden,
# niet de drempel verlaagd; een regel die er echt niet komt, krijgt een pragma
# met de reden erachter.
#
# Every statement in the integration is touched by the suite: the round-31
# measurement shows 0 missed lines (4995 of 4995). The 21 open branches that
# `branch = true` measures alongside them are one side of a loop or a
# short-circuit (`a or b`) that never comes past; neither a test nor a pragma
# closes them, and they stand as an idea in ROADMAP.md. The threshold sits at the
# measured total to two decimals: 99.687 % -> 99.68. That is a ratchet: one new
# uncovered line drops `coverage report` at once (an extra missed line falls to
# 99.672 %), while a covered line only gives the threshold more room. If coverage
# drops, the question to ask is "which test was forgotten here", not to lower the
# threshold; a line that truly cannot be reached gets a pragma with the reason
# behind it.
fail_under = 99.68

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
strict = true

