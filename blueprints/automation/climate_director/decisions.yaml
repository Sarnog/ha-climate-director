blueprint:
  name: Climate Director - wat er besloten is / decision notifier
  author: Sarnog
  homeassistant:
    min_version: "2025.3.0"
  source_url: https://github.com/Sarnog/ha-climate-director/blob/main/blueprints/automation/climate_director/decisions.yaml
  description: >-
    NL - Meldt na elke beslissing wat de director met een kamer doet, en waarom.
    Standaard in gewone taal: de integratie levert de zin kant-en-klaar mee in
    `message`, in de taal van je interface, dus je hoeft zelf geen sjabloon te
    schrijven. Niet noodzakelijk, wel het handigste gereedschap dat er is bij
    het inrichten en tijdens een schaduwrun: je ziet zonder in de diagnose te
    duiken wat er zou gebeuren.


    Draait alles eenmaal naar wens, dan wil je hem waarschijnlijk beperken tot
    de redenen of de acties die je echt wilt weten - of uitzetten. Wie alleen
    wil horen dat een apparaat uitgaat, kiest bij *Alleen deze acties* `off`.


    Redenen zijn stabiele identifiers, dus je kunt erop filteren:
    `regulating`, `satisfied`, `within_deadband`, `master_disabled`,
    `manual_override`, `opening_open`, `opening_open_elsewhere`, `nobody_home`,
    `everyone_asleep`, `waiting_for_sleeper`, `early_riser`, `outside_schedule`,
    `zone_unoccupied`, `quiet_hours`,
    `no_indoor_temperature`, `no_outdoor_temperature`, `season_blocks_mode`,
    `outdoor_outside_window`,
    `mode_not_configured`, `no_source_available`, `other_source_chosen`,
    `manual_source`, `source_unreachable`, `shared_source_took_over`,
    `circuit_conflict_lost`,
    `circuit_switch_too_soon`, `circuit_switch_pending`, `circuit_at_capacity`,
    `short_cycle_protection`, `exclusive_group_lost`.


    EN - Reports what the director does with a room after every decision, and
    why. In plain language by default: the integration hands the sentence over
    ready-made in `message`, in the language of your interface, so you do not
    have to write a template yourself. Not essential, but the handiest tool
    there is while setting up and during a shadow run: you see what would happen
    without diving into the diagnostics.


    Once everything runs the way you want it, you probably want to narrow it to
    the reasons or the actions you actually care about - or switch it off.
    Whoever only wants to hear that an appliance goes off picks `off` under
    *Only these actions*.


    Reasons are stable identifiers, so you can filter on them; the list is
    above.
  domain: automation
  input:
    notify_action:
      name: Notificatie-actie / Notification action
      description: >-
        NL - Wat er aangeroepen wordt om te melden. Een `notify.*`-dienst, of je
        eigen script - het krijgt `title` en `message` mee.

        EN - What gets called to notify. A `notify.*` service, or a script of
        your own - it is handed `title` and `message`.
      default: notify.persistent_notification
      selector:
        action: {}
    only_reasons:
      name: Alleen deze redenen / Only these reasons
      description: >-
        NL - Laat leeg om alles te melden. Vul redenen in om alleen die te
        krijgen, bijvoorbeeld `circuit_conflict_lost`.

        EN - Leave empty to report everything. Fill in reasons to get only
        those, for instance `circuit_conflict_lost`.
      default: []
      selector:
        text:
          multiple: true
    only_actions:
      name: Alleen deze acties / Only these actions
      description: >-
        NL - Laat leeg om elke actie te melden. Kies er een of meer om alleen die
        te krijgen, bijvoorbeeld alleen `off` (gaat uit): dan hoor je het zodra
        een apparaat uitgaat, en niet telkens wanneer een kamer uit blijft. Een
        event zonder `action` - een oudere integratie - wordt hier niet op
        gefilterd.

        EN - Leave empty to report every action. Pick one or more to get only
        those, for instance only `off` (is going off): then you hear it as soon
        as an appliance goes off, and not every time a room stays off. An event
        without `action` - an older integration - is not filtered on this.
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: heat - gaat verwarmen / is going to heat
              value: heat
            - label: cool - gaat koelen / is going to cool
              value: cool
            - label: off - gaat uit / is going off
              value: "off"
            - label: stays_off - blijft uit / stays off
              value: stays_off
            - label: left_alone - wordt met rust gelaten / is left alone
              value: left_alone
    only_zones:
      name: Alleen deze zones / Only these zones
      description: >-
        NL - Laat leeg voor alle kamers. Vul zone-ID's in om je tot die te
        beperken.

        EN - Leave empty for every room. Fill in zone ids to limit it to those.
      default: []
      selector:
        text:
          multiple: true
    title:
      name: Titel / Title
      default: Climate Director
      selector:
        text: {}
    message:
      name: Bericht / Message
      description: >-
        NL - Een sjabloon. Standaard toont hij `message`: de kant-en-klare zin
        die de integratie zelf opbouwt, in de taal van de interface, met de
        kamer, wat er gebeurt, het apparaat bij zijn naam en de reden als gewone
        zin. Beschikbaar: `zone_name`, `zone_id`, `wanted`, `granted`,
        `source_id`, `entity_id`, `hvac_mode`, `temperature`,
        `temperature_unit`, `reason`, `reason_text`, `action`, `action_text`,
        `source_name` en `message`. `reason` en `action` blijven de stabiele
        identifiers om op te filteren (zie *Alleen deze redenen* en *Alleen deze
        acties*); `reason_text` en `action_text` zijn dezelfde reden en actie als
        gewone zin. Wie hier zijn eigen zin schrijft, houdt hem zoals
        hij is. Een event zonder `message` - een oudere integratie - valt terug
        op de kamer, de stand en de reden in plaats van een sjabloonfout te
        geven.

        EN - A template. By default it shows `message`: the ready-made sentence
        the integration builds itself, in the language of the interface, with
        the room, what happens, the appliance by its name and the reason as an
        ordinary sentence. Available: `zone_name`, `zone_id`, `wanted`,
        `granted`, `source_id`, `entity_id`, `hvac_mode`, `temperature`,
        `temperature_unit`, `reason`, `reason_text`, `action`, `action_text`,
        `source_name` and `message`. `reason` and `action` stay the stable
        identifiers to filter on (see *Only these reasons* and *Only these
        actions*); `reason_text` and `action_text` are that same reason and
        action as an ordinary sentence. Whoever writes their own sentence here keeps
        it as it is. An event without `message` - an older integration - falls
        back to the room, the mode and the reason instead of raising a template
        error.
      default: "{{ trigger.event.data.message | default(trigger.event.data.zone_name ~ ' — ' ~ trigger.event.data.granted ~ ' (' ~ trigger.event.data.reason ~ ')') }}"
      selector:
        text:
          multiline: true

mode: queued
max: 25

triggers:
  - trigger: event
    event_type: climate_director_decision

variables:
  only_reasons: !input only_reasons
  only_actions: !input only_actions
  only_zones: !input only_zones

conditions:
  - condition: template
    value_template: >-
      {{ (only_reasons | length == 0 or trigger.event.data.reason in
      only_reasons) and (only_actions | length == 0 or 'action' not in
      trigger.event.data or trigger.event.data.action in only_actions) and
      (only_zones | length == 0 or trigger.event.data.zone_id in only_zones) }}

actions:
  - action: !input notify_action
    data:
      title: !input title
      message: !input message
