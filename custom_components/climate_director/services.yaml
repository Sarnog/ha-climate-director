evaluate:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director

precondition:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_ids:
      required: false
      example: "[woonkamer, zolder]"
      selector:
        text:
          multiple: true
    # Geen `default`: de beschrijving zegt dat leeglaten het ingestelde maximum
    # geeft, en een voorgevuld getal in het scherm sprak dat tegen. Wie het veld
    # niet aanraakt hoort het maximum te krijgen, en dat gebeurt ook.
    #
    # No `default`: the description says leaving it empty grants the configured
    # maximum, and a number pre-filled in the screen contradicted that. Whoever
    # leaves the field alone should get the maximum, and now does.
    minutes:
      required: false
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: box
    ignore_openings:
      required: false
      default: false
      selector:
        boolean:

cancel_precondition:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_ids:
      required: false
      example: "[woonkamer]"
      selector:
        text:
          multiple: true
