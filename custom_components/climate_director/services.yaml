evaluate:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director

precondition:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_ids:
      required: false
      example: "[woonkamer, zolder]"
      selector:
        text:
          multiple: true
    # Geen `default`: de beschrijving zegt dat leeglaten het ingestelde maximum
    # geeft, en een voorgevuld getal in het scherm sprak dat tegen. Wie het veld
    # niet aanraakt hoort het maximum te krijgen, en dat gebeurt ook.
    #
    # No `default`: the description says leaving it empty grants the configured
    # maximum, and a number pre-filled in the screen contradicted that. Whoever
    # leaves the field alone should get the maximum, and now does.
    minutes:
      required: false
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: box
    ignore_openings:
      required: false
      default: false
      selector:
        boolean:

cancel_precondition:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_ids:
      required: false
      example: "[woonkamer]"
      selector:
        text:
          multiple: true

set_override:
  # Een entiteit als doel is de vorm die de kaart `simple-timer-card` stuurt: bij
  # een timestamp-sensor heeft zijn annuleerknop geen `data` nodig, want de kaart
  # zet de sensor zelf als `target.entity_id` in de aanroep. Home Assistant plakt
  # dat doel aan de data, dus `entity_id` komt bij de actie binnen. `zone_id`
  # blijft bestaan voor wie de zone bij naam kent; minstens één van de twee is
  # verplicht en de actie weigert een entiteit die geen override is.
  #
  # An entity as the target is the shape the `simple-timer-card` card sends: with
  # a timestamp sensor its cancel button needs no `data`, since the card puts the
  # sensor itself in the call as `target.entity_id`. Home Assistant merges that
  # target into the data, so `entity_id` arrives at the action. `zone_id` stays
  # for whoever knows the zone by name; at least one of the two is required and
  # the action refuses an entity that is no override.
  target:
    entity:
      integration: climate_director
      domain:
        - sensor
        - switch
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_id:
      required: false
      example: "woonkamer"
      selector:
        text:
    hvac_mode:
      required: true
      selector:
        select:
          options:
            - "off"
            - "heat"
            - "cool"
            - "fan_only"
          mode: dropdown
    temperature:
      required: false
      selector:
        number:
          step: 0.5
          mode: box
    minutes:
      required: false
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: box
    when_done:
      required: false
      default: turn_off
      selector:
        select:
          options:
            - "turn_off"
            - "leave"
          mode: dropdown

clear_override:
  target:
    entity:
      integration: climate_director
      domain:
        - sensor
        - switch
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: climate_director
    zone_id:
      required: false
      example: "woonkamer"
      selector:
        text:
