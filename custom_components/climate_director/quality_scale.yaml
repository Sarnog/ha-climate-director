rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: "Deze integratie praat met geen enkel apparaat of dienst; er valt niets te pollen. / This integration talks to no appliance or service; there is nothing to poll."
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  # De config flow en de options flow zijn regel voor regel gedekt: 509 van 509
  # statements, 0 gemist (100 %). `branch = true` meldt daarnaast twee open
  # takken in `config_flow.py`, en die zijn met een reden verantwoord in plaats
  # van gedicht: `238->240` is een opslaan dat nooit het menu opende (het menu
  # zet `_shadow_mode` altijd), en `1074->1084` is een verwijderde zone zonder
  # `zone_id` (elke zone heeft er een). Beide zijn verdedigende haken die geen
  # enkel UI-pad raakt. De oude "≥95 %"-ondergrens is daarmee vervallen.
  #
  # The config flow and the options flow are covered line by line: 509 of 509
  # statements, 0 missed (100 %). `branch = true` additionally reports two open
  # branches in `config_flow.py`, accounted for rather than closed: `238->240`
  # is a save that never opened the menu (the menu always sets `_shadow_mode`),
  # and `1074->1084` is a removed zone without a `zone_id` (every zone has one).
  # Both are defensive guards no UI path reaches. The old "≥95 %" floor has
  # therefore lapsed.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: "Geen bibliotheek, geen netwerkstapel en geen afhankelijkheid buiten Home Assistant zelf. / No library, no network stack and no dependency beyond Home Assistant itself."
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: "De integratie registreert geen eigen automatiseringstriggers; de blueprints bieden triggers aan, maar dat is een apart onderdeel. / The integration registers no automation triggers of its own; the blueprints provide triggers, but that is a separate part."
  docs-conditions:
    status: exempt
    comment: "De integratie registreert geen eigen automatiseringscondities; de blueprints gebruiken condities, maar dat is een apart onderdeel. / The integration registers no automation conditions of its own; the blueprints use conditions, but that is a separate part."
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: "De integratie praat met geen enkel apparaat of dienst, dus er valt niets te testen vóór het opslaan. / The integration talks to no appliance or service, so there is nothing to test before saving."
  test-before-setup:
    status: exempt
    comment: "Zonder apparaat of dienst valt er niets te controleren vóór de setup. / Without an appliance or service there is nothing to check before setup."
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: "Geen eigen entiteiten die apparaten of diensten spiegelen; onleesbare invoer krijgt een reparatiemelding. / No own entities mirroring appliances or services; unreadable input gets a repair notice."
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: "Er is geen verbinding die weg kan vallen; sensoruitval loopt via de reparatiemelding `unreadable_entities`. / There is no connection that can drop; sensor outages run through the `unreadable_entities` repair notice."
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: "Geen host, poort, sleutel of account; er valt niets te herauthenticeren. / No host, port, key or account; there is nothing to re-authenticate."
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: "Geen ontdekking, dus ook geen ontdekkingsinformatie om bij te werken. / No discovery, so no discovery information to update."
  discovery:
    status: exempt
    comment: "Er is niets te ontdekken, de gebruiker kiest zelf zijn apparaten en sensoren. / There is nothing to discover; the user picks their own appliances and sensors."
  docs-data-update: done
  # De zes gidsen beschrijven wanneer de director opnieuw beslist: bij elke
  # toestandswijziging die er voor hem toe doet, en daarnaast op de klok (het
  # vangnet en de momenten die hij zelf in de toekomst verwacht).
  #
  # The six guides describe when the director decides again: on every state
  # change that matters to it, and additionally on the clock (the safety net and
  # the moments it expects in the future itself).
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: "Geen apparaat of dienst waar de integratie mee praat; de ondersteunde invoer staat in de handleiding. / No appliance or service the integration talks to; the supported input is in the manual."
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: "Geen apparaten van een externe bron; alles komt uit de eigen configuratie. / No devices from an external source; everything comes from the integration's own configuration."
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: "Er is geen entiteit die een nieuwe gebruiker in de weg zit, en standaard uitschakelen zou bestaande dashboards en kaarten breken. / No entity gets in a new user's way, and disabling by default would break existing dashboards and cards."
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: "Geen host, poort of sleutel; alles wat een gebruiker wil wijzigen gaat al via de options flow. / No host, port or key; everything a user wants to change already goes through the options flow."
  repair-issues: done
  stale-devices:
    status: exempt
    comment: "Er zijn geen apparaten van buiten die kunnen verouderen; de installatie is één device. / There are no external devices that can go stale; the installation is one device."
  # Platinum
  async-dependency:
    status: exempt
    comment: "Geen bibliotheek of netwerkstapel om asynchroon te laden. / No library or network stack to load asynchronously."
  inject-websession:
    status: exempt
    comment: "Geen websessie nodig, de integratie doet geen HTTP. / No web session needed; the integration does no HTTP."
  strict-typing:
    status: done
    comment: "Nul mypy-fouten in 39 bestanden, gemeten op 2026-09-14 (mypy 2.3.1, strict); ronde 30 haalde de laatste 156 weg. De vier mixins erven sinds die ronde onder `TYPE_CHECKING` van het `CoordinatorSurface`-protocol in de coördinator, want zij liggen op de coördinator zonder erft van de coördinator; de rest was echte narrowing. De CI-baan blokkeert weer. / Zero mypy errors in 39 files, measured on 2026-09-14 (mypy 2.3.1, strict); round 30 removed the last 156. Since that round the four mixins inherit from the `CoordinatorSurface` protocol in the coordinator under `TYPE_CHECKING`, because they sit on the coordinator without the coordinator sitting on them; the rest was honest narrowing. The CI job blocks again."
