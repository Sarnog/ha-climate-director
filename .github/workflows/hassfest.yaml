name: Validate with hassfest

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - ".github/workflows/hassfest.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - ".github/workflows/hassfest.yaml"
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "home-assistant/actions/hassfest@master"
