name: Validate

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/hacs.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/hacs.yaml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
