name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m coverage run -m pytest -q

      # De drempel staat in pyproject.toml; deze stap laat de baan vallen zodra
      # de dekking eronder zakt. Let op: die drempel vergelijkt met twee
      # decimalen (`precision` in pyproject) en verdraagt de wiebel in de
      # partiële takken, dus hij valt pas bij twee gemiste regels.
      #
      # The threshold sits in pyproject.toml; this step drops the job the moment
      # coverage falls below it. Note: that threshold compares with two decimals
      # (`precision` in pyproject) and absorbs the wobble in the partial
      # branches, so it only drops at two missed lines.
      - name: Coverage
        run: python -m coverage report

      # En deze stap is de scherpe kant: geen enkele gemiste regel. Zie
      # script/coverage_gate.py en de uitleg in pyproject.toml.
      #
      # And this step is the sharp side: not a single missed line. See
      # script/coverage_gate.py and the explanation in pyproject.toml.
      - name: Coverage gate
        run: python script/coverage_gate.py

  # `strict-typing` staat sinds ronde 30 op nul fouten (zie quality_scale.yaml).
  # De baan blokkeert dus gewoon: een nieuwe fout laat de pull request rood
  # worden in plaats van er stilletjes bij te staan.
  #
  # `strict-typing` has stood at zero errors since round 30 (see
  # quality_scale.yaml). The job therefore blocks like any other: a new error
  # turns the pull request red instead of quietly standing beside it.
  mypy:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Mypy
        run: python -m mypy custom_components/climate_director

  # De README, de handleidingen en `hacs.json` beloven Home Assistant 2025.3 als
  # ondergrens. Deze baan draait de suite tegen precies die versie, zodat de
  # belofte gecontroleerd wordt in plaats van aangenomen. Alleen pytest: ruff
  # draait al hierboven en kijkt niet naar de Home Assistant-versie.
  #
  # The README, the guides and `hacs.json` promise Home Assistant 2025.3 as the
  # floor. This job runs the suite against exactly that version, so the promise
  # is checked rather than assumed. Pytest only: ruff already runs above and
  # does not look at the Home Assistant version.
  oldest-supported:
    name: Tests on the oldest supported Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install "homeassistant==2025.3.*"

      - name: Pytest
        run: python -m pytest -q
