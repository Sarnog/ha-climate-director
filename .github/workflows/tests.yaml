name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Een baan draait alleen als het deel dat hij toetst veranderde
# (`script/select_tests.py`): de commit vóór de push, of de basis van de pull
# request, is `CD_BASE`. Een met de hand gestarte run kent geen basis en draait dus
# alles. Er is geen geplande run: zonder wijziging draait er niets.
#
# A job only runs when the part it tests changed (`script/select_tests.py`): the
# commit before the push, or the base of the pull request, is `CD_BASE`. A
# manually started run knows no base and therefore runs everything. There is no
# scheduled run: without a change nothing runs.
env:
  CD_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || '' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      mypy: ${{ steps.select.outputs.mypy }}
      oldest: ${{ steps.select.outputs.oldest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select
        id: select
        run: python script/select_tests.py changes

  tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      # De selectie, de dekking en de kaart in één stap: zie script/run_tests.py.
      # Draait alles, dan meet hij het hele pakket tegen de drempel in
      # pyproject.toml en houdt script/coverage_gate.py de regels buiten de meting
      # bij naam; draait een selectie, dan moeten de gewijzigde pakketbestanden
      # volledig gedekt zijn.
      #
      # The selection, the coverage and the map in one step: see
      # script/run_tests.py. When everything runs it measures the whole package
      # against the threshold in pyproject.toml and script/coverage_gate.py keeps
      # the lines outside the measurement by name; when a selection runs, the
      # changed package files must be covered completely.
      - name: Pytest
        env:
          CD_IMPACT_ARTIFACT: ${{ runner.temp }}/impact_map.json
        run: python script/run_tests.py

      - name: Impact map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-map
          path: ${{ runner.temp }}/impact_map.json
          if-no-files-found: ignore

  # `strict-typing` staat sinds ronde 30 op nul fouten (zie quality_scale.yaml).
  # De baan blokkeert dus gewoon: een nieuwe fout laat de pull request rood
  # worden in plaats van er stilletjes bij te staan.
  #
  # `strict-typing` has stood at zero errors since round 30 (see
  # quality_scale.yaml). The job therefore blocks like any other: a new error
  # turns the pull request red instead of quietly standing beside it.
  mypy:
    name: Mypy (strict)
    needs: changes
    if: needs.changes.outputs.mypy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Mypy
        run: python -m mypy custom_components/climate_director

  # De README, de handleidingen en `hacs.json` beloven Home Assistant 2025.3 als
  # ondergrens. Deze baan draait de suite tegen precies die versie, zodat de
  # belofte gecontroleerd wordt in plaats van aangenomen. Alleen pytest: ruff
  # draait al hierboven en kijkt niet naar de Home Assistant-versie.
  #
  # The README, the guides and `hacs.json` promise Home Assistant 2025.3 as the
  # floor. This job runs the suite against exactly that version, so the promise
  # is checked rather than assumed. Pytest only: ruff already runs above and
  # does not look at the Home Assistant version.
  oldest-supported:
    name: Tests on the oldest supported Home Assistant
    needs: changes
    if: needs.changes.outputs.oldest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install "homeassistant==2025.3.*"

      - name: Pytest
        run: python script/run_tests.py --no-coverage
