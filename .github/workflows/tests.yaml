name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q

  # De README, de handleidingen en `hacs.json` beloven Home Assistant 2025.3 als
  # ondergrens. Deze baan draait de suite tegen precies die versie, zodat de
  # belofte gecontroleerd wordt in plaats van aangenomen. Alleen pytest: ruff
  # draait al hierboven en kijkt niet naar de Home Assistant-versie.
  #
  # The README, the guides and `hacs.json` promise Home Assistant 2025.3 as the
  # floor. This job runs the suite against exactly that version, so the promise
  # is checked rather than assumed. Pytest only: ruff already runs above and
  # does not look at the Home Assistant version.
  oldest-supported:
    name: Tests on the oldest supported Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install "homeassistant==2025.3.*"

      - name: Pytest
        run: python -m pytest -q
