name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m coverage run -m pytest -q

      # De drempel staat in pyproject.toml; deze stap laat de baan vallen zodra
      # de dekking eronder zakt.
      #
      # The threshold sits in pyproject.toml; this step drops the job the moment
      # coverage falls below it.
      - name: Coverage
        run: python -m coverage report

  # `strict-typing` meet 106 fouten (zie quality_scale.yaml). De baan is
  # niet-blokkerend zolang dat aantal boven nul is; het aantal mag alleen
  # omlaag, en bij nul wordt `continue-on-error` weggehaald.
  #
  # `strict-typing` measures 106 errors (see quality_scale.yaml). The job is
  # non-blocking while that count is above zero; the count may only go down,
  # and once it reaches zero `continue-on-error` is removed.
  mypy:
    name: Mypy (strict, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Mypy
        run: python -m mypy custom_components/climate_director

  # De README, de handleidingen en `hacs.json` beloven Home Assistant 2025.3 als
  # ondergrens. Deze baan draait de suite tegen precies die versie, zodat de
  # belofte gecontroleerd wordt in plaats van aangenomen. Alleen pytest: ruff
  # draait al hierboven en kijkt niet naar de Home Assistant-versie.
  #
  # The README, the guides and `hacs.json` promise Home Assistant 2025.3 as the
  # floor. This job runs the suite against exactly that version, so the promise
  # is checked rather than assumed. Pytest only: ruff already runs above and
  # does not look at the Home Assistant version.
  oldest-supported:
    name: Tests on the oldest supported Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install "homeassistant==2025.3.*"

      - name: Pytest
        run: python -m pytest -q
